name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Publish latest APK release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/debug/app-debug.apk release-assets/Edu-CoreX-Android.apk
          gh release view apps-latest >/dev/null 2>&1 || gh release create apps-latest --title "Edu CoreX latest apps" --notes "Latest downloadable Edu CoreX APK and EXE builds." || gh release view apps-latest >/dev/null
          gh release upload apps-latest release-assets/Edu-CoreX-Android.apk --clobber

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: edu-corex-android-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/*.apk
