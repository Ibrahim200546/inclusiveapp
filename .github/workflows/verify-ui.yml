name: Verify build and UI

on:
  push:
    branches: [main, restore/windows-work-20261116, fix/mobile-landing-overflow-20261116]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npx tsc -b --noEmit
      - run: npm test
      - run: node --test scripts/release/release.test-node.mjs
      - run: npx playwright install --with-deps chrome
      - name: Reconstructed work regressions
        run: npx playwright test e2e/download-layout.spec.ts e2e/restored-work.spec.ts e2e/all-tasks.spec.ts e2e/exercise-orbits.spec.ts e2e/phonetic-pairs.spec.ts e2e/practice-minimal.spec.ts e2e/voice-navigation.spec.ts
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-failure-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
