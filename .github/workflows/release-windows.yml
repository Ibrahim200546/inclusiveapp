name: Release Windows Desktop

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set CI release version
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $base = node -p "require('./package.json').version"
          $parts = $base.Split('.')
          $major = if ($parts.Length -gt 0) { $parts[0] } else { "0" }
          $minor = if ($parts.Length -gt 1) { $parts[1] } else { "1" }
          $version = "$major.$minor.${{ github.run_number }}"
          npm version $version --no-git-tag-version --allow-same-version

      - name: Build web app
        run: npm run build

      - name: Publish Windows release
        run: npm run publish:win

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: edu-corex-windows-${{ github.sha }}
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
