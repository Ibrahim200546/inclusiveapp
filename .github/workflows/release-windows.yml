name: Release Windows Desktop

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-checks:
    uses: ./.github/workflows/verify-ui.yml
  release-windows:
    needs: ui-checks
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Resolve shared release version
        run: node scripts/release/version.mjs
      - name: Test release automation
        run: node --test scripts/release/release.test-node.mjs
      - name: Build Windows installer
        run: npm run dist:win
      - name: Publish versioned and stable Windows assets
        run: node scripts/release/publish.mjs windows
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: edu-corex-windows-${{ github.sha }}
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error
